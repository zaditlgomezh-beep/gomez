<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Científica</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #07152f, #102b55, #07152f);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 1000px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.header p {
    color: #aebedc;
}

.calculator-container {
    display: grid;
    grid-template-columns: minmax(350px, 600px) 280px;
    gap: 20px;
    align-items: start;
}

.calculator {
    background: #0b1c39;
    border: 1px solid #284d82;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}

.display {
    background: #020a19;
    border: 2px solid #1e6fd9;
    border-radius: 15px;
    padding: 15px;
    min-height: 110px;
    margin-bottom: 15px;
    overflow: hidden;
}

.expression {
    min-height: 30px;
    color: #91a9ca;
    font-size: 18px;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

.result {
    font-size: 38px;
    text-align: right;
    color: #ffffff;
    overflow-x: auto;
    white-space: nowrap;
}

.status {
    display: flex;
    justify-content: space-between;
    color: #62c7ff;
    font-size: 13px;
    margin-top: 8px;
}

.modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.mode {
    border: none;
    border-radius: 10px;
    padding: 10px;
    background: #18345f;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.mode.active {
    background: #1689e8;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}

button {
    min-height: 55px;
    border: none;
    border-radius: 12px;
    background: #19365f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
    box-shadow: inset 0 -3px rgba(0,0,0,0.2);
}

button:hover {
    filter: brightness(1.2);
    transform: translateY(-1px);
}

button:active {
    transform: scale(0.96);
}

.function {
    background: #284fa1;
}

.operator {
    background: #087bd4;
}

.action {
    background: #e94b4b;
}

.memory {
    background: #6641a8;
}

.equals {
    background: #00a87a;
}

.constant {
    background: #a16b17;
}

.zero {
    grid-column: span 2;
}

.equals {
    grid-row: span 2;
}

.side-panel {
    background: #0b1c39;
    border: 1px solid #284d82;
    border-radius: 20px;
    padding: 18px;
}

.side-panel h2 {
    margin-bottom: 15px;
    font-size: 20px;
}

.history {
    max-height: 350px;
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-bottom: 1px solid #234267;
    cursor: pointer;
}

.history-item:hover {
    background: #132b50;
}

.history-expression {
    color: #8fa8c8;
    font-size: 13px;
}

.history-result {
    color: #fff;
    font-size: 17px;
    margin-top: 4px;
}

.clear-history {
    width: 100%;
    margin-top: 12px;
    background: #d83d48;
}

.help {
    margin-top: 20px;
    color: #aebedc;
    line-height: 1.6;
    font-size: 14px;
}

.help strong {
    color: white;
}

@media (max-width: 800px) {

    .calculator-container {
        grid-template-columns: 1fr;
    }

    .side-panel {
        display: none;
    }

    .header h1 {
        font-size: 25px;
    }

    button {
        min-height: 48px;
        font-size: 14px;
    }

    .result {
        font-size: 30px;
    }
}

@media (max-width: 450px) {

    body {
        padding: 8px;
    }

    .calculator {
        padding: 10px;
        border-radius: 18px;
    }

    .buttons {
        gap: 5px;
    }

    button {
        min-height: 44px;
        border-radius: 9px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🧮 Calculadora Científica</h1>
        <p>Rápida, completa y fácil de usar</p>
    </div>

    <div class="calculator-container">

        <div class="calculator">

            <div class="display">

                <div class="expression" id="expression"></div>

                <div class="result" id="result">0</div>

                <div class="status">
                    <span id="angleStatus">DEG</span>
                    <span id="memoryStatus">M: 0</span>
                </div>

            </div>

            <!-- MODOS -->
            <div class="modes">
                <button class="mode active" id="degBtn" onclick="setAngle('DEG')">
                    DEG
                </button>

                <button class="mode" id="radBtn" onclick="setAngle('RAD')">
                    RAD
                </button>

                <button class="mode" onclick="toggleInverse()">
                    2nd
                </button>
            </div>

            <!-- BOTONES -->
            <div class="buttons">

                <!-- Fila 1 -->
                <button class="action" onclick="clearAll()">AC</button>
                <button class="action" onclick="deleteLast()">DEL</button>
                <button class="memory" onclick="memoryClear()">MC</button>
                <button class="memory" onclick="memoryRecall()">MR</button>
                <button class="memory" onclick="memoryAdd()">M+</button>
                <button class="memory" onclick="memorySubtract()">M-</button>

                <!-- Fila 2 -->
                <button class="function" onclick="scientific('sin')">sin</button>
                <button class="function" onclick="scientific('cos')">cos</button>
                <button class="function" onclick="scientific('tan')">tan</button>
                <button class="function" onclick="scientific('log')">log</button>
                <button class="function" onclick="scientific('ln')">ln</button>
                <button class="function" onclick="scientific('sqrt')">√</button>

                <!-- Fila 3 -->
                <button class="function" onclick="scientific('asin')">sin⁻¹</button>
                <button class="function" onclick="scientific('acos')">cos⁻¹</button>
                <button class="function" onclick="scientific('atan')">tan⁻¹</button>
                <button class="function" onclick="scientific('square')">x²</button>
                <button class="function" onclick="scientific('cube')">x³</button>
                <button class="function" onclick="scientific('factorial')">n!</button>

                <!-- Fila 4 -->
                <button class="constant" onclick="insert('π')">π</button>
                <button class="constant" onclick="insert('e')">e</button>
                <button onclick="insert('(')">(</button>
                <button onclick="insert(')')">)</button>
                <button onclick="insert('%')">%</button>
                <button onclick="insert('^')">xʸ</button>

                <!-- Fila 5 -->
                <button onclick="insert('7')">7</button>
                <button onclick="insert('8')">8</button>
                <button onclick="insert('9')">9</button>
                <button class="operator" onclick="insert('÷')">÷</button>
                <button class="operator" onclick="insert('×')">×</button>
                <button class="operator" onclick="insert('-')">−</button>

                <!-- Fila 6 -->
                <button onclick="insert('4')">4</button>
                <button onclick="insert('5')">5</button>
                <button onclick="insert('6')">6</button>
                <button class="operator" onclick="insert('+')">+</button>
                <button onclick="insert('.')">.</button>
                <button onclick="insert('Ans')">Ans</button>

                <!-- Fila 7 -->
                <button onclick="insert('1')">1</button>
                <button onclick="insert('2')">2</button>
                <button onclick="insert('3')">3</button>
                <button class="equals" onclick="calculate()">=</button>

                <!-- Fila 8 -->
                <button class="zero" onclick="insert('0')">0</button>
                <button onclick="toggleSign()">±</button>

            </div>

        </div>

        <!-- PANEL LATERAL -->
        <div class="side-panel">

            <h2>📜 Historial</h2>

            <div class="history" id="history">
                <p style="color:#8fa8c8;">
                    No hay operaciones todavía.
                </p>
            </div>

            <button class="clear-history" onclick="clearHistory()">
                Borrar historial
            </button>

            <div class="help">

                <strong>⌨️ Teclado</strong>

                <br>

                Puedes utilizar el teclado de tu computadora.

                <br><br>

                <strong>Funciones:</strong>

                <br>
                + − × ÷ = operaciones
                <br>
                ^ = potencia
                <br>
                ( ) = paréntesis
                <br>
                Enter = calcular
                <br>
                Backspace = borrar
                <br>
                Escape = limpiar

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let currentExpression = "";
let lastAnswer = 0;
let memory = 0;
let angleMode = "DEG";
let inverseMode = false;
let history = [];


/* =========================================
   ELEMENTOS
========================================= */

const expressionDisplay =
    document.getElementById("expression");

const resultDisplay =
    document.getElementById("result");

const angleStatus =
    document.getElementById("angleStatus");

const memoryStatus =
    document.getElementById("memoryStatus");

const historyContainer =
    document.getElementById("history");


/* =========================================
   ACTUALIZAR PANTALLA
========================================= */

function updateDisplay() {

    expressionDisplay.textContent =
        currentExpression || "";

    resultDisplay.textContent =
        currentExpression ? "..." : formatNumber(lastAnswer);

    memoryStatus.textContent =
        "M: " + formatNumber(memory);
}


/* =========================================
   INSERTAR
========================================= */

function insert(value) {

    currentExpression += value;

    expressionDisplay.textContent =
        currentExpression;

    resultDisplay.textContent = "...";
}


/* =========================================
   LIMPIAR
========================================= */

function clearAll() {

    currentExpression = "";

    expressionDisplay.textContent = "";

    resultDisplay.textContent = "0";
}


/* =========================================
   BORRAR ÚLTIMO
========================================= */

function deleteLast() {

    currentExpression =
        currentExpression.slice(0, -1);

    updateDisplay();
}


/* =========================================
   MODO DE ÁNGULO
========================================= */

function setAngle(mode) {

    angleMode = mode;

    angleStatus.textContent = mode;

    document.getElementById("degBtn")
        .classList.toggle("active", mode === "DEG");

    document.getElementById("radBtn")
        .classList.toggle("active", mode === "RAD");
}


/* =========================================
   MODO INVERSO
========================================= */

function toggleInverse() {

    inverseMode = !inverseMode;

    const buttons =
        document.querySelectorAll(".function");

    buttons.forEach(button => {

        if (inverseMode) {

            if (button.textContent === "sin")
                button.textContent = "sin⁻¹";

            else if (button.textContent === "cos")
                button.textContent = "cos⁻¹";

            else if (button.textContent === "tan")
                button.textContent = "tan⁻¹";

        } else {

            if (button.textContent === "sin⁻¹")
                button.textContent = "sin";

            else if (button.textContent === "cos⁻¹")
                button.textContent = "cos";

            else if (button.textContent === "tan⁻¹")
                button.textContent = "tan";
        }

    });
}


/* =========================================
   FUNCIONES CIENTÍFICAS
========================================= */

function scientific(type) {

    let value = currentExpression;

    if (!value && type !== "factorial")
        return;

    switch(type) {

        case "sin":

            if (inverseMode)
                currentExpression = `asin(${value})`;
            else
                currentExpression = `sin(${value})`;

            break;


        case "cos":

            if (inverseMode)
                currentExpression = `acos(${value})`;
            else
                currentExpression = `cos(${value})`;

            break;


        case "tan":

            if (inverseMode)
                currentExpression = `atan(${value})`;
            else
                currentExpression = `tan(${value})`;

            break;


        case "asin":
            currentExpression = `asin(${value})`;
            break;


        case "acos":
            currentExpression = `acos(${value})`;
            break;


        case "atan":
            currentExpression = `atan(${value})`;
            break;


        case "log":
            currentExpression = `log(${value})`;
            break;


        case "ln":
            currentExpression = `ln(${value})`;
            break;


        case "sqrt":
            currentExpression = `sqrt(${value})`;
            break;


        case "square":
            currentExpression = `(${value})^2`;
            break;


        case "cube":
            currentExpression = `(${value})^3`;
            break;


        case "factorial":
            currentExpression = `factorial(${value})`;
            break;
    }

    updateDisplay();
}


/* =========================================
   CAMBIAR SIGNO
========================================= */

function toggleSign() {

    if (!currentExpression)
        return;

    currentExpression =
        `(-1)*(${currentExpression})`;

    updateDisplay();
}


/* =========================================
   FACTORIAL
========================================= */

function factorial(n) {

    if (n < 0 || !Number.isInteger(n))
        throw new Error("Factorial inválido");

    if (n > 170)
        throw new Error("Número demasiado grande");

    let result = 1;

    for (let i = 2; i <= n; i++)
        result *= i;

    return result;
}


/* =========================================
   TRIGONOMETRÍA
========================================= */

function toRadians(value) {

    if (angleMode === "DEG")
        return value * Math.PI / 180;

    return value;
}


function fromRadians(value) {

    if (angleMode === "DEG")
        return value * 180 / Math.PI;

    return value;
}


function sin(value) {

    return Math.sin(toRadians(value));
}


function cos(value) {

    return Math.cos(toRadians(value));
}


function tan(value) {

    return Math.tan(toRadians(value));
}


function asin(value) {

    return fromRadians(Math.asin(value));
}


function acos(value) {

    return fromRadians(Math.acos(value));
}


function atan(value) {

    return fromRadians(Math.atan(value));
}


/* =========================================
   PORCENTAJE
========================================= */

function percent(value) {

    return value / 100;
}


/* =========================================
   LOGARITMOS
========================================= */

function log(value) {

    return Math.log10(value);
}


function ln(value) {

    return Math.log(value);
}


/* =========================================
   FORMATEAR NÚMERO
========================================= */

function formatNumber(number) {

    if (!Number.isFinite(number))
        return "Error";

    if (Math.abs(number) < 1e-12)
        number = 0;

    return Number(number.toPrecision(12)).toString();
}


/* =========================================
   EVALUAR EXPRESIÓN
========================================= */

function evaluateExpression(expression) {

    let exp = expression;

    /*
       Reemplazamos símbolos de la calculadora
    */

    exp = exp
        .replaceAll("×", "*")
        .replaceAll("÷", "/")
        .replaceAll("π", "Math.PI")
        .replace(/\be\b/g, "Math.E")
        .replace(/\bAns\b/g, `(${lastAnswer})`)
        .replaceAll("^", "**");


    /*
       Validación básica de seguridad.
       Solo permitimos caracteres matemáticos.
    */

    if (!/^[0-9+\-*/%().,\s_a-zA-Z]*$/.test(exp)) {

        throw new Error("Expresión no válida");
    }


    /*
       Agregamos funciones permitidas
    */

    const allowed =
        /^[0-9+\-*/%().,\s_a-zA-Z]*$/;

    if (!allowed.test(exp)) {

        throw new Error("Caracter no permitido");
    }


    /*
       JavaScript calcula la expresión.
    */

    const result =
        Function(
            "sin",
            "cos",
            "tan",
            "asin",
            "acos",
            "atan",
            "log",
            "ln",
            "sqrt",
            "factorial",
            "percent",
            `
            "use strict";
            return (${exp});
            `
        )(
            sin,
            cos,
            tan,
            asin,
            acos,
            atan,
            log,
            ln,
            Math.sqrt,
            factorial,
            percent
        );


    if (!Number.isFinite(result))
        throw new Error("Resultado inválido");

    return result;
}


/* =========================================
   CALCULAR
========================================= */

function calculate() {

    if (!currentExpression)
        return;

    try {

        const original =
            currentExpression;

        const result =
            evaluateExpression(currentExpression);

        lastAnswer = result;

        resultDisplay.textContent =
            formatNumber(result);

        expressionDisplay.textContent =
            original + " =";

        addHistory(
            original,
            result
        );

        currentExpression =
            String(result);

    }

    catch(error) {

        resultDisplay.textContent =
            "Error";

        expressionDisplay.textContent =
            error.message;

    }
}


/* =========================================
   HISTORIAL
========================================= */

function addHistory(expression, result) {

    history.unshift({
        expression,
        result
    });

    if (history.length > 30)
        history.pop();

    renderHistory();
}


function renderHistory() {

    if (history.length === 0) {

        historyContainer.innerHTML =
            `<p style="color:#8fa8c8;">
                No hay operaciones todavía.
             </p>`;

        return;
    }


    historyContainer.innerHTML =
        history.map((item, index) => `

            <div
                class="history-item"
                onclick="useHistory(${index})"
            >

                <div class="history-expression">
                    ${escapeHTML(item.expression)}
                </div>

                <div class="history-result">
                    = ${formatNumber(item.result)}
                </div>

            </div>

        `).join("");
}


function useHistory(index) {

    currentExpression =
        String(history[index].result);

    updateDisplay();
}


function clearHistory() {

    history = [];

    renderHistory();
}


/* =========================================
   ESCAPAR HTML
========================================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


/* =========================================
   MEMORIA
========================================= */

function getCurrentValue() {

    try {

        if (currentExpression)
            return evaluateExpression(currentExpression);

        return lastAnswer;

    } catch {

        return lastAnswer;
    }
}


function memoryClear() {

    memory = 0;

    updateDisplay();
}


function memoryRecall() {

    currentExpression =
        String(memory);

    updateDisplay();
}


function memoryAdd() {

    memory += getCurrentValue();

    updateDisplay();
}


function memorySubtract() {

    memory -= getCurrentValue();

    updateDisplay();
}


/* =========================================
   TECLADO
========================================= */

document.addEventListener("keydown", function(event) {

    const key = event.key;


    if (
        /[0-9]/.test(key) ||
        ["+", "-", "*", "/", ".", "(", ")", "%", "^"]
            .includes(key)
    ) {

        let value = key;

        if (key === "*")
            value = "×";

        if (key === "/")
            value = "÷";

        insert(value);

        return;
    }


    if (key === "Enter" || key === "=") {

        event.preventDefault();

        calculate();

        return;
    }


    if (key === "Backspace") {

        deleteLast();

        return;
    }


    if (key === "Escape") {

        clearAll();

        return;
    }

});


/* =========================================
   INICIO
========================================= */

updateDisplay();

</script>

</body>
</html>
